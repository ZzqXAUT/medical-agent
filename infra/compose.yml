name: mednav

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mednav}
      POSTGRES_USER: ${POSTGRES_USER:-mednav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mednav_local}
    ports:
      - "5432:5432"
    volumes:
      - mednav-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - mednav-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mednav-postgres:
  mednav-redis:

