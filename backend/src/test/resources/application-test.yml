spring:
  datasource:
    url: jdbc:h2:mem:mednav;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

management:
  health:
    redis:
      enabled: false

mednav:
  auth:
    bcrypt-strength: 4
  agent:
    mode: stub
    stub-delay: 0ms
  memory:
    cache: in-memory
    idle-timeout: 10m
    idle-scan-ms: 60000
